<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Formulir</title>
		<link rel="stylesheet" href="/style/style.css" />
		<script src="/js/script.js"></script>
	</head>
	<body>
		<h3><a class="kembali" href="index.html">Kembali</a></h3>
		<p>Data Diri</p>
		<form id="dataForm" method="post">
			<label for="nama_depan">Nama Depan:</label>
			<input type="text" id="nama_depan" name="nama_depan" />
			<br /><br />

			<label for="nama_belakang">Nama Belakang:</label>
			<input type="text" id="nama_belakang" name="nama_belakang" />
			<br /><br />

			<p><b>Pilih Provinsi</b></p>
			<input type="checkbox" id="bali" name="provinsi" value="Bali" />
			<label for="bali">Bali</label>
			<br />

			<input type="checkbox" id="ntt" name="provinsi" value="NTT" />
			<label for="ntt">NTT</label>
			<br />

			<input type="checkbox" id="papua" name="provinsi" value="Papua" />
			<label for="papua">Papua</label>
			<br />

			<input type="checkbox" id="jawa_timur" name="provinsi" value="Jawa Timur" />
			<label for="jawa_timur">Jawa Timur</label>
			<br />

			<input type="checkbox" id="kalimantan" name="provinsi" value="Kalimantan" />
			<label for="kalimantan">Kalimantan</label>
			<br /><br />

			<p><b>Daftar</b></p>
			<label for="email">Alamat Email:</label>
			<input type="text" id="email" name="email" />
			<br /><br />

			<label for="password">Password:</label>
			<input type="password" id="password" name="password" maxlength="8" />
			<br /><br />

			<label for="kota">Pilih Kota:</label>
			<select id="kota" name="kota" class="submit-button">
				<option value="pilih">Pilih</option>
				<option value="kota denpasar">Denpasar</option>
				<option value="kota surabaya">Surabaya</option>
				<option value="kota batu">Batu</option>
				<option value="kota singaraja">Singaraja</option>
			</select>
			<br /><br />

			<input type="button" name="submit" value="Submit" class="submit-button" onclick="clearForm()" />
		</form>
	</body>
</html>
